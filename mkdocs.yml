site_name: XAMS simulation (xams-sim)
site_description: Geant4 optical simulation of the XAMS TPC — how it works, how to run it, how to analyse it
docs_dir: docs
strict: true
exclude_docs: |
  .DS_Store

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Installation: setup.md
      - Quick start: quickstart.md
      - Configuration: configuration.md
  - Running:
      - Particle mode: particle.md
      - Optical simulation: optical.md
      - Simulation chain: chain.md
      - Viewers: viewers.md
      - Electric field: efield.md
      - On STBC (private and production MC): stbc.md
  - Output:
      - Output formats: output.md
      - Reading the output: analysis.md
  - Reference:
      - xamsg4 program: xamsg4.md
      - xamssim package: xamssim.md
      - Geometry: geometry.md
      - Optics: optics.md
      - Validation checks: validation.md
  - Development:
      - Development guide: development.md
      - Roadmap (full chain): xams_sim_plan.md
      - Electric-field plan: efield_plan.md
