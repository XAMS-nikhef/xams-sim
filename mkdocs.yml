site_name: XAMS simulation (xams-sim)
site_description: Geant4 optical simulation of the XAMS TPC — how it works, how to run it, how to analyse it
docs_dir: docs
strict: true
exclude_docs: |
  .DS_Store
  results/**/*.json

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Using it:
      - How it works: concepts.md
      - Setup: setup.md
      - Running: running.md
      - Output files: output.md
      - Your own analysis: analysis.md
      - Pitfalls: pitfalls.md
  - The model:
      - Geometry: geometry.md
      - Optics and parameters: optics.md
      - Validation: validation.md
  - Results:
      - Summary: results.md
      - First physics (step 6): results/step6/README.md
      - Data comparison (step 7): results/step7/README.md
      - Fit and dead-cross test (step 8): results/step8/README.md
      - Design study (extra PTFE): results/design_ptfe/README.md
      - Anode mesh rotated by 120°: results/anode_rotation/README.md
      - Surroundings (bucket, vessel, PMT holders): results/surroundings/README.md
      - Fit with photopeak events: results/step8_photopeak/README.md
      - Threshold toy (central dip): results/threshold_toy/README.md
      - S2 width map: results/s2width_map/README.md
      - S2 AFT per size class: results/size_classes/README.md
      - S1 AFT vs drift time: results/s1aft_depth/README.md
      - S1-AFT cut and energy spectrum: results/s1cut_spectrum/README.md
      - Top-PMT channel test: results/channel_test/README.md
      - Drift-velocity profile: results/drift_profile/README.md
      - Ring shadows: results/ring_shadows/README.md
      - Source position: results/source_position/README.md
      - cS2 spread map: results/spread_map/README.md
      - SiPM checks: results/sipm_checks/README.md
      - Particle mode check (S2, Cs-137): results/s2_particle/README.md
  - Reference:
      - File map: files.md
      - Implementation plan: plan.md
      - E-field plan: efield_plan.md
      - Full simulation chain plan: xams_sim_plan.md
