# XAMS materials — the single source for every material property used anywhere in xams-sim:
#   Geant4 (via optical/make_config.py -> config.json), the COMSOL field models (efield/comsol), the simulation chain
#   (xamssim, fuse settings). geometry.yaml only says which part is made of which material (`material: <key>`).
# Units: g/cm³, K, bar; relative permittivity; optics as listed.

reference_conditions:          # decision 2026-10-18 (user): 2 bar, 175 K
  pressure_bar: 2.0
  temperature_k: 175.0
  source: >-
    NIST Chemistry WebBook, xenon fluid properties (2026-10-18): liquid at 2 bar / 175 K 2.8748 g/cm³ (boiling point at
    2 bar 177.88 K, so 2.9 K sub-cooled); the gas above the liquid is saturated vapour: at 2 bar 0.018694 g/cm³
    (177.88 K). For comparison: saturated liquid / vapour at 175 K ≈ 2.876 / 0.0167 g/cm³ at ≈ 1.75 bar.

materials:
  liquid_xenon:
    density_g_cm3: 2.8748
    state: liquid
    temperature_k: 175.0
    pressure_bar: 2.0
    geant4: {composition: {Xe: 1}, molar_mass_g_mol: 131.29}
    electrical: {kind: dielectric, relative_permittivity: 1.96}
    transport:                   # electrons in the liquid (simulation chain, S4)
      drift_velocity: nest       # NEST SetDriftVelocity(T, density, |E|): 1.45 mm/µs at 145 V/cm, 175 K
      diffusion_longitudinal_cm2_s: 25.0   # approximate literature value (D_L ≈ 20–30 cm²/s at 0.1–0.4 kV/cm); tune on the S2 width
      diffusion_transverse_cm2_s: 55.0     # approximate literature value (D_T ≈ 50–60 cm²/s); sub-mm effect in XAMS
      extraction: nest           # extraction efficiency vs field: NEST (CalculateG2)
  gas_xenon:
    density_g_cm3: 0.018694      # saturated vapour at 2 bar
    state: gas
    temperature_k: 177.88
    pressure_bar: 2.0
    geant4: {composition: {Xe: 1}, molar_mass_g_mol: 131.29}
    electrical: {kind: dielectric, relative_permittivity: 1.00}
    transport:                   # electrons in the gas gap (simulation chain, S5)
      drift_velocity_mm_us: 3.1  # TUNED: median S2 width50 at the gate of the SR-2026.2 Cs photopeak (605 ns; S5 study 2026-10-19); no measurement found at ~9 Td
      el_yield: monteiro2007     # photons per electron per cm = 140 E[kV/cm] - 116 p_eq[bar], p_eq = pressure at 293 K with the same density (Monteiro et al. 2007)
  ptfe:                          # inner cylinder, PMT holders, bucket
    density_g_cm3: 2.2
    geant4: {nist: G4_TEFLON}
    electrical: {kind: dielectric, relative_permittivity: 2.1}
  stainless_steel:               # meshes and their rings, cryostat vessel
    density_g_cm3: 8.0
    geant4: {nist: G4_STAINLESS-STEEL}
    electrical: {kind: conductor}
  copper:                        # field-shaping rings
    density_g_cm3: 8.96
    geant4: {nist: G4_Cu}
    electrical: {kind: conductor}
  silica:                        # PMT windows (fused silica)
    density_g_cm3: 2.2
    geant4: {composition: {Si: 1, O: 2}}
    electrical: {kind: dielectric, relative_permittivity: 3.8}
  aluminium:                     # photocathode stand-in in the optical model
    density_g_cm3: 2.699
    geant4: {nist: G4_Al}
    electrical: {kind: conductor}
  kovar:                         # PMT bodies (R12699 metal package) — for the particle mode (S2); the optical model
    density_g_cm3: 8.36          #   treats bodies and frames as perfect absorbers
    geant4: {composition_by_mass: {Fe: 0.54, Ni: 0.29, Co: 0.17}}
    electrical: {kind: conductor}

# ------------------------------------------------------------------------------------------------ optical properties
# (moved here from geometry.yaml on 2026-10-18, unchanged.) Values with a range are free parameters, fitted to the data
# (targets in geometry.yaml). Read by optical/make_config.py into config.json `optics` (same keys as before, so scans and
# fits that set e.g. optics.ptfe_in_liquid.reflectivity are unaffected).
optics:                    # one value each; scans vary them with --set (xamssim optical, scan files `grid:`)
  wavelength_nm: 178
  lxe:
    refractive_index: 1.69
    rayleigh_length_cm: 45     # optical fit 2026-10-11 (clean joint fit; grid 30 / 45 / 60); literature 30-60
    absorption_length_cm: 550  # not fitted (purity); plausible 100-1000
  gxe:
    refractive_index: 1.00
  ptfe_in_liquid:
    reflectivity: 0.95         # optical fit 2026-10-11 (grid 0.90 / 0.95 / 0.99)
    specular_fraction: 0.1     # optical fit 2026-10-11 (grid 0 / 0.1 / 0.2)
  ptfe_in_gas:
    reflectivity: 0.75         # not fitted (no PTFE in the gas in the current geometry); plausible 0.60-0.90
    specular_fraction: 0.15    # not fitted; plausible 0-0.3
  stainless_steel_reflectivity: 0.2   # meshes, rings, foil rims; optical fit 2026-10-11 (grid 0.2 / 0.35 / 0.5, low preferred)
  copper_reflectivity: 0.3            # field-shaping rings at 178 nm (Lambertian); not fitted, plausible 0.2-0.4
  pmt_window_refractive_index: 1.60   # fused silica at 178 nm (check with the window material)
