# Source positions outside the cryostat, by the height of the source on the z tape of the outer vessel (hand-drawn scale,
# 1-30 cm, 1 at the bottom). Runs name one with `position:` next to an isotope `source:` (config/sources/).
#
# z (detector frame, z = 0 at the gate foil, mm) = (tape_cm - gate_tape_cm) * 10
#   survey 2026-11-17 (measurements/survey_20261117/README.md): height above the floor = tape + 71.4 cm, gate at
#   90.7 +- 0.5 cm above the floor -> gate at tape 19.3 cm; cathode at tape 14.1, drift centre at tape 16.7 (z -25.9).
#   The "stick" of the run comments is this tape (user 2026-11-19).
# azimuth / r: the September place on the outer vessel (azimuth ~169 deg +- 15 from the data, r ~129 mm on the vessel);
#   the survey gives no source azimuth. Data frame (+x towards top-PMT sectors 1 and 3, +y towards 1 and 2).
# Which data runs had which height: measurements/SR2026.3/config/runs/*.csv, column src_tape_cm.

gate_tape_cm: 19.3

positions:
  t16:   {tape_cm: 16.0, azimuth_deg: 169, r_mm: 129, description: "SR-2026.3 MA, FN*, MH*, MN*, TH* (2-3 Nov): z -33 mm"}
  t16.5: {tape_cm: 16.5, azimuth_deg: 169, r_mm: 129, description: "SR-2026.3 R900S (P4a - 3 cm): z -28 mm"}
  t18:   {tape_cm: 18.0, azimuth_deg: 169, r_mm: 129, description: "SR-2026.3 D25-D150, P4B, PG*: z -13 mm"}
  t19.5: {tape_cm: 19.5, azimuth_deg: 169, r_mm: 129, description: "SR-2026.3 P4a, standard position of R900*: z +2 mm"}
