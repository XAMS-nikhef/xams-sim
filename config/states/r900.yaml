# Detector state: SR-2026.3 R900* 7790-7902, R900T 7929, BG16, P4B 7957-7980. Sources: analysis_SR2026.3/config/runs/*.csv, sc_snapshot of the runs.
description: "SR-2026.3 r900: anode +2101, gate -646, cathode -1146, BS -445, SiPM -900 V; PMTs -900 / -950 V"
detector: xams2026           # config/detectors/xams2026/geometry.yaml
hv_case: r900
daq: sr2026_3_p4             # detectors/xams2026/daq_sr2026_3_p4.yaml (gains P4)
liquid_level_mm: 4.0         # above the gate, as for this fill
pressure_bar: 1.49           # measured: pmain in sc_snapshot (SR-2026.3 sets 1.48-1.52 bar)
electron_lifetime_us: 424.0    # SR2026.3_v4 lifetime (mean over the runs of R900 7790-7837 (48 runs, 357-487); later blocks on this field: S 533, F 574, P90/M90 ~600, B 629, T/BG16/P4B 707)
sensors:
  pmt_hv_v: {top: -900, bottom: -950}
