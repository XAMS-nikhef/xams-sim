# Detector state of SR-2026.3 on detector xams_sr2026_3 (survey 2026-11-17: anode foil up, gate-anode 9.30 mm, drawing 9.15 between the foil faces; SiPMs 128 / 52 deg).
# Data: MH4 8028-8029, MN1 / MN1col 8091-8109 (3-11). HV case mh4 (efield/cases.yaml, from sc_snapshot). Made 2026-11-19.
description: "SR-2026.3 mh4: anode +2501, gate -1046, cathode -1546 V (97 V/cm), BS -845, SiPM -1290 V; PMTs -900 / -950 V"
detector: xams_sr2026_3
hv_case: mh4
daq: sr2026_3_p4b           # detectors/xams_sr2026_3/daq_sr2026_3_p4b.yaml (gains P4 (later sets ran with P5: not in xams-sim), ch0 threshold 16, Science_Rev2.6)
liquid_level_mm: 4.0         # above the gate: 4 mm LXe + 5.30 mm GXe (S2 widths, 2026-11-01)
pressure_bar: 1.49           # pmain in sc_snapshot (absolute)
electron_lifetime_us: 900.0    # asymptote of the SR2026.3 v7 time model (1/tau -> 1.11 /ms); per-block fits of 3-11 noisy
extraction: {model: nest, shift_kV_cm: 0.13, note: "NEST at the liquid temperature (saturation at pressure_bar: 172.07 K at 1.49 bar), moved by 0.13 kV/cm: fit to cS2 vs dV of the SR-2026.3 anode / gate scan with geometry v8 (anode foil 9.30 mm, 4.0 mm LXe + 5.30 mm GXe, f_mesh 0.930; 2026-11-21: 0.134, 0.130-0.140, chi2 9.9/7). Was 0.21 with geometry v7 (9.65 mm, 2026-11-20) and 0.30 at NEST default 177 K (2026-11-02). Effective correction of the NEST threshold"}
sensors:
  pmt_hv_v: {top: -900, bottom: -950}
