# Step 8 fit grid (s2): PTFE reflectivity x PTFE specular fraction x steel reflectivity x Rayleigh length, level 4 mm.
name: fit_s2
source: s2
rmax_mm: 30
photons: 10000000
chunks: 8
seed: 80000
base:
  level: 4.0
grid:
