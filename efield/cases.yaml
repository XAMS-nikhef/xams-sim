  d135: {A: 2106, G: -646, C: -1345, BS: -644, TS: 0, PMT_T: -900, PMT_B: -950, SIPM: -987, export: [planes],
          note: "SR-2026.3 D135 7923-7925: drift scan ~135 V/cm"}
  d140: {A: 2106, G: -646, C: -1371, BS: -670, TS: 0, PMT_T: -900, PMT_B: -950, SIPM: -1000, export: [planes],
          note: "SR-2026.3 D140 7926-7928: drift scan ~140 V/cm (SiPM at its −1000 V limit)"}
  d150: {A: 2106, G: -646, C: -1423, BS: -722, TS: 0, PMT_T: -900, PMT_B: -950, SIPM: -987, export: [planes, sipm],
          note: "SR-2026.3 D150 7930-7932: drift scan ~150 V/cm (SiPM −987 V, below equalised)"}
  pg1: {A: 2106, G: -696, C: -1196, BS: -495, TS: 0, PMT_T: -900, PMT_B: -950, SIPM: -940, export: [planes],
          note: "SR-2026.3 PG1 7933-7935: gate −50 V vs r900 (drift field as r900)"}
  pg2: {A: 2106, G: -746, C: -1246, BS: -545, TS: 0, PMT_T: -900, PMT_B: -950, SIPM: -990, export: [planes],
          note: "SR-2026.3 PG2 7936-7938: gate −100 V vs r900"}
  pg3: {A: 2301, G: -746, C: -1246, BS: -545, TS: 0, PMT_T: -900, PMT_B: -950, SIPM: -990, export: [planes],
